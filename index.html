<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch them all!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid white;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
        }

        h1 { margin-top: 0; font-size: 2rem; }
        p { font-size: 1.2rem; }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            color: black;
            background: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background: #ddd; }

        /* Skill Check UI */
        #skillcheck-container {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }
        #skillcheck-label {
            background: rgba(80, 80, 80, 0.9);
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 2px solid #666;
        }
        #skillcheck-bar {
            width: 300px; height: 30px;
            background: #333;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
            border: 2px solid #222;
        }
        #skillcheck-target {
            position: absolute; height: 100%;
            background: #f4c242;
        }
        #skillcheck-cursor {
            position: absolute; height: 120%; width: 4px;
            background: #d84552; top: -10%;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: flex; justify-content: space-between;
            padding: 0 20px; box-sizing: border-box; pointer-events: none;
        }
        .control-group {
            display: flex; gap: 15px; pointer-events: auto;
            flex-wrap: wrap; justify-content: center;
        }
        .btn-mobile {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white; border-radius: 50%;
            color: white; font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            user-select: none; font-weight: bold;
        }
        .btn-mobile:active { background: rgba(255, 255, 255, 0.5); }
        .action-btn { border-radius: 15px; font-size: 16px; width: 80px; }

        /* HUD */
        #hud {
            position: absolute; top: 20px; left: 20px;
            font-size: 1.5rem; font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #white-fade {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; transition: opacity 2s;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">Animals: 0/5</div>

        <div id="start-screen" class="screen" style="display: flex;">
            <h1>Exotic Pet Hunter</h1>
            <p>Skip animals by walking past them. Press SPACE to catch.</p>
            <p>Hold ESCAPE to hide when parents are near!</p>
            <button onclick="startGame()">START</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h1 id="game-over-title">Game Over</h1>
            <button onclick="restartLevel()">Try Again</button>
        </div>

        <div id="skillcheck-container">
            <div id="skillcheck-label">PRESS SPACE</div>
            <div id="skillcheck-bar">
                <div id="skillcheck-target"></div>
                <div id="skillcheck-cursor"></div>
            </div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="control-group" style="max-width: 150px;">
            <div class="btn-mobile" id="btn-up" style="width: 100%; height: 50px; border-radius: 10px;">↑</div>
            <div class="btn-mobile" id="btn-left">←</div>
            <div class="btn-mobile" id="btn-down">↓</div>
            <div class="btn-mobile" id="btn-right">→</div>
        </div>
        <div class="control-group" style="flex-direction: column;">
            <div class="btn-mobile action-btn" id="btn-hide">HIDE</div>
            <div class="btn-mobile action-btn" id="btn-space">ACTION</div>
        </div>
    </div>

    <div id="white-fade"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Categories
        const animals = {
            easy: ['🐇', '🐿️', '🦔', '🐢', '🦦', '🦨', '🦥'],
            mid: ['🦊', '🦝', '🦡', '🦇', '🦩', '🦚', '🦜', '🐦‍⬛', '🐡'],
            normal: ['🫎', '🦓', '🦌', '🐪', '🦙', '🦒', '🦘', '\%$', '🦉', '🐒', '🐼', '🐨', '🐬', '🦭'],
            hard: ['🦍', '🦧', '🦁', '🐯', '🦬', '🐗', '🐘', '🦏', '🦛', '🐻', '🐻‍❄️', '🐊', '🐍', '🦈', '🐙', '🪼', '🦑', '🕷️', '🦂']
        };
        const terrains = {
            'savannah': { color: '#e9d082', hideEmoji: '🌾' },
            'forest': { color: '#2d5a27', hideEmoji: '🌿' },
            'arctic': { color: '#d3e8ee', hideEmoji: '🧊' }
        };

        // Game State
        let state = 'MENU';
        let petsCaught = 0;
        let groundY = canvas.height * 0.75;
        
        let currentTerrain = '';
        let targetAnimal = '';
        let targetDiff = '';
        let targetPrompt = '';
        
        // Entities
        let player = { x: 100, y: groundY, size: 50, emoji: '🦹', speed: 5, hidden: false };
        let baby = { x: canvas.width - 200, y: groundY, size: 30 };
        let stealthParents = []; 
        let stealthInvuln = 0; 

        // Skillcheck & Runner variables
        let sc = { active: false, cursorX: 0, targetX: 0, targetW: 50, speed: 3, dir: 1, max: 300 };
        let runner = { x: 0, y: groundY, vy: 0, grav: 0.8, jumpForce: -15, step: '', speedX: 0, jumps: 0, reachedMiddle: false };
        let obstacles = [];
        let wolvesX = 0; 

        // Input Tracking
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false, Escape: false };

        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
            if(e.code === 'Space') handleAction();
        });
        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
        });

        function bindTouch(id, code) {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[code] = true; if(code==='Space') handleAction(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[code] = false; });
        }
        bindTouch('btn-up', 'ArrowUp'); bindTouch('btn-down', 'ArrowDown');
        bindTouch('btn-left', 'ArrowLeft'); bindTouch('btn-right', 'ArrowRight');
        bindTouch('btn-space', 'Space'); bindTouch('btn-hide', 'Escape');

        function generateLevel() {
            player.x = 50; player.y = groundY; player.hidden = false;
            
            if (petsCaught >= 4) {
                currentTerrain = 'forest';
                targetAnimal = '🐺';
                targetDiff = 'cerise';
                targetPrompt = "so it was inevitable fate afterall";
            } else {
                let terrKeys = Object.keys(terrains);
                currentTerrain = terrKeys[Math.floor(Math.random() * terrKeys.length)];
                
                let diffs = ['easy', 'mid', 'normal', 'hard'];
                targetDiff = diffs[Math.floor(Math.random() * diffs.length)];
                let arr = animals[targetDiff];
                targetAnimal = arr[Math.floor(Math.random() * arr.length)];
                
                if(targetDiff === 'easy') targetPrompt = "easy money";
                if(targetDiff === 'mid' || targetDiff === 'normal') targetPrompt = "catch this?";
                if(targetDiff === 'hard') targetPrompt = "are you sure risking yourself";
            }
            state = 'EXPLORE';
            updateHUD();
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            petsCaught = 0;
            generateLevel();
            requestAnimationFrame(gameLoop);
        }

        function restartLevel() {
            document.getElementById('game-over-screen').style.display = 'none';
            if(state === 'RUN_DEAD') {
                startRunnerPhase();
            } else {
                if (petsCaught < 4) {
                    petsCaught = 0; 
                }
                generateLevel();
            }
        }

        function updateHUD() {
            document.getElementById('hud').innerText = `Animals: ${petsCaught}/5`;
        }

        function startStealthApproach() {
            state = 'APPROACH';
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.hidden = false;
            stealthInvuln = 60; 
            
            stealthParents = [];
            if(targetDiff === 'cerise') {
                stealthParents.push({ angle: 0, radius: 150, speed: 0.05, dir: 1 });
                stealthParents.push({ angle: Math.PI, radius: 250, speed: 0.06, dir: -1 });
            } else {
                let pSpeed = targetDiff === 'hard' ? 0.04 : (targetDiff === 'easy' ? 0.015 : 0.025);
                stealthParents.push({ angle: Math.random()*Math.PI*2, radius: 180, speed: pSpeed, dir: 1 });
                if (targetDiff === 'hard') {
                    stealthParents.push({ angle: Math.random()*Math.PI*2, radius: 280, speed: pSpeed * 0.8, dir: -1 });
                }
            }
        }

        function startSkillcheck() {
            state = 'SKILLCHECK';
            keys.ArrowLeft = false; keys.ArrowRight = false; keys.Space = false;
            document.getElementById('skillcheck-container').style.display = 'flex';
            
            if(targetDiff === 'easy') { sc.targetW = 100; sc.speed = 2; }
            else if(targetDiff === 'mid') { sc.targetW = 75; sc.speed = 3.5; }
            else if(targetDiff === 'normal') { sc.targetW = 50; sc.speed = 5; }
            else if(targetDiff === 'hard') { sc.targetW = 30; sc.speed = 7; }
            else if(targetDiff === 'cerise') { sc.targetW = 15; sc.speed = 10; }

            sc.cursorX = 0;
            sc.targetX = Math.random() * (sc.max - sc.targetW - 20) + 10;
            document.getElementById('skillcheck-target').style.width = sc.targetW + 'px';
            document.getElementById('skillcheck-target').style.left = sc.targetX + 'px';
        }

        function handleAction() {
            if (state === 'EXPLORE') {
                let dist = Math.abs(player.x - baby.x);
                if(dist < 150) startStealthApproach();
            } 
            else if (state === 'SKILLCHECK') {
                if (sc.cursorX >= sc.targetX && sc.cursorX <= sc.targetX + sc.targetW) {
                    document.getElementById('skillcheck-container').style.display = 'none';
                    petsCaught++;
                    if (petsCaught >= 5) startRunnerPhase();
                    else generateLevel();
                } else {
                    document.getElementById('skillcheck-container').style.display = 'none';
                    triggerGameOver();
                }
            }
            else if (state === 'RUNNING') {
                if(runner.y >= groundY) runner.vy = runner.jumpForce;
            }
        }

        function triggerGameOver() {
            state = 'DEAD';
            if(targetDiff === 'cerise') {
                document.getElementById('game-over-title').innerText = "Don't dodge the fate";
            } else {
                document.getElementById('game-over-title').innerText = "Game Over";
            }
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function startRunnerPhase() {
            state = 'RUNNING';
            document.getElementById('hud').style.display = 'none';
            
            runner.x = canvas.width - 100;
            runner.reachedMiddle = false;
            runner.jumps = 0; runner.speedX = 0; runner.step = '';
            
            wolvesX = canvas.width + 400; 
            obstacles = [];
            currentTerrain = 'forest'; 
        }

        window.addEventListener('keydown', (e) => {
            if(state !== 'RUNNING') return;
            if(e.code === 'ArrowLeft') handleRunnerStep('left');
            if(e.code === 'ArrowRight') handleRunnerStep('right');
        });
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { if(state === 'RUNNING') handleRunnerStep('left'); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { if(state === 'RUNNING') handleRunnerStep('right'); });

        function handleRunnerStep(key) {
            if (runner.step !== key) {
                runner.speedX = Math.min(runner.speedX + 1.8, 10); 
                runner.step = key; 
            } else {
                runner.speedX = Math.max(runner.speedX - 0.5, 0);
            }
        }

        function triggerWin() {
            state = 'WIN';
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 } });
            draw();
            
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "white";
            ctx.font = "bold 60px Courier New";
            ctx.textAlign = "center";
            ctx.fillText("CONGRATS!", canvas.width/2, canvas.height/2);

            setTimeout(() => { document.getElementById('white-fade').style.opacity = '1'; }, 2000);
        }

        function gameLoop() {
            update();
            draw();
            if(state !== 'WIN') requestAnimationFrame(gameLoop);
        }

        function update() {
            if (state === 'EXPLORE') {
                const exploreSpeed = 15;
                if(keys.ArrowLeft) player.x -= exploreSpeed;
                if(keys.ArrowRight) player.x += exploreSpeed;
                
                if (player.x > canvas.width + 50) {
                    generateLevel();
                }
                player.x = Math.max(20, player.x);
            } 
            else if (state === 'APPROACH') {
                if (stealthInvuln > 0) stealthInvuln--; 

                player.hidden = keys.Escape; 
                
                if (!player.hidden) {
                    if(keys.ArrowUp) player.y -= player.speed;
                    if(keys.ArrowDown) player.y += player.speed;
                    if(keys.ArrowLeft) player.x -= player.speed;
                    if(keys.ArrowRight) player.x += player.speed;
                }

                player.x = Math.max(0, Math.min(canvas.width, player.x));
                player.y = Math.max(0, Math.min(canvas.height, player.y));

                let cx = canvas.width / 2;
                let cy = canvas.height / 2;
                
                let pDistToCenter = Math.hypot(player.x - cx, player.y - cy);
                if (pDistToCenter < 40) {
                    startSkillcheck();
                }

                stealthParents.forEach(p => {
                    p.angle += p.speed * p.dir;
                    let px = cx + Math.cos(p.angle) * p.radius;
                    let py = cy + Math.sin(p.angle) * p.radius;
                    
                    let distToPlayer = Math.hypot(player.x - px, player.y - py);
                    if (distToPlayer < 45 && !player.hidden && stealthInvuln <= 0) {
                        triggerGameOver();
                    }
                });
            }
            else if (state === 'SKILLCHECK') {
                sc.cursorX += sc.speed * sc.dir;
                if(sc.cursorX > sc.max) sc.dir = -1;
                if(sc.cursorX < 0) sc.dir = 1;
                document.getElementById('skillcheck-cursor').style.left = sc.cursorX + 'px';
            }
            else if (state === 'RUNNING') {
                runner.vy += runner.grav; runner.y += runner.vy;
                if (runner.y >= groundY) { runner.y = groundY; runner.vy = 0; if(keys.Space) handleAction(); }
                
                runner.speedX = Math.max(0, runner.speedX - 0.08);
                
                if (!runner.reachedMiddle) {
                    runner.x -= (runner.speedX + 2) * 0.5;
                    wolvesX = canvas.width + 300; 
                    
                    if (runner.x <= canvas.width / 2) {
                        runner.reachedMiddle = true;
                        runner.x = canvas.width / 2;
                        wolvesX = canvas.width / 2 + 250; 
                    }
                } else {
                    const baseWolfSpeed = 5.4; // Increased chase speed for added adrenaline
                    wolvesX += (runner.speedX - baseWolfSpeed);
                    wolvesX = Math.min(canvas.width + 100, wolvesX);
                }

                if(runner.reachedMiddle && Math.random() < 0.015 && obstacles.length < 2) {
                    let types = ['🪨', '🌵', '🌳'];
                    obstacles.push({ x: -50, emoji: types[Math.floor(Math.random()*types.length)], passed: false });
                }

                for(let i=obstacles.length-1; i>=0; i--) {
                    let obs = obstacles[i];
                    obs.x += (runner.speedX + 3); 
                    if(obs.x > runner.x && !obs.passed) {
                        obs.passed = true;
                        if(runner.y < groundY - 20) { 
                            runner.jumps++; if(runner.jumps >= 25) triggerWin();
                        } else {
                            runner.speedX = 0; 
                        }
                    }
                    if(obs.x > canvas.width + 100) obstacles.splice(i, 1);
                }

                if(wolvesX <= runner.x + 40) {
                    state = 'RUN_DEAD';
                    document.getElementById('game-over-title').innerText = "The Pack Caught You!";
                    document.getElementById('game-over-screen').style.display = 'flex';
                }
            }
        }

        function draw() {
            ctx.fillStyle = terrains[currentTerrain] ? terrains[currentTerrain].color : '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center"; ctx.textBaseline = "middle";

            if (state === 'EXPLORE') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, groundY + 25, canvas.width, canvas.height - groundY);

                ctx.fillStyle = "white"; ctx.font = "20px Courier New";
                ctx.fillText(targetPrompt, baby.x, baby.y - 60);

                ctx.font = "50px Arial";
                ctx.fillText(targetAnimal, baby.x, baby.y); 
                ctx.fillText('🦹', player.x, player.y);

                if (Math.abs(player.x - baby.x) < 150) {
                    ctx.fillStyle = "yellow"; ctx.font = "16px Courier New";
                    ctx.fillText("Press Space to Approach", player.x, player.y - 60);
                }
            } 
            else if (state === 'APPROACH' || state === 'SKILLCHECK') {
                let cx = canvas.width / 2;
                let cy = canvas.height / 2;

                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.lineWidth = 2;
                [100, 180, 280, 380].forEach(r => {
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.stroke();
                });

                ctx.font = "40px Arial";
                ctx.fillText(targetAnimal, cx, cy);

                ctx.font = "60px Arial";
                stealthParents.forEach(p => {
                    let px = cx + Math.cos(p.angle) * p.radius;
                    let py = cy + Math.sin(p.angle) * p.radius;
                    ctx.fillText(targetAnimal, px, py);
                    
                    let dist = Math.hypot(player.x - px, player.y - py);
                    if(dist < 100 && !player.hidden) {
                        ctx.fillStyle = "red"; ctx.font = "20px Arial";
                        ctx.fillText("❗", px, py - 40);
                    }
                });

                ctx.font = "45px Arial";
                let drawEmoji = player.hidden ? terrains[currentTerrain].hideEmoji : '🦹';
                
                if (stealthInvuln > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                ctx.fillText(drawEmoji, player.x, player.y);
                ctx.globalAlpha = 1.0;
            }
            else if (state === 'RUNNING' || state === 'RUN_DEAD') {
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, groundY + 25, canvas.width, canvas.height - groundY);

                ctx.fillStyle = "white"; ctx.font = "bold 30px Courier New"; ctx.textAlign = "left";
                ctx.fillText(`Jumps: ${runner.jumps}/25`, 20, 50);
                ctx.font = "16px Courier New";
                ctx.fillText("Alternate Left/Right to run. Space to jump.", 20, 80);

                ctx.font = "50px Arial";
                obstacles.forEach(o => { ctx.fillText(o.emoji, o.x, groundY); });

                ctx.font = "80px Arial";
                ctx.fillText('🐺🐺', wolvesX, groundY);

                ctx.font = "60px Arial";
                ctx.fillText('🏃', runner.x, runner.y);
            }
        }
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height * 0.75;
        });
    </script>
</body>
</html>
